</style></head><body>
<header><div class="brand-lockup"><img class="brand-mockup" src="../dist/marca-photosphera.webp" width="600" height="131" alt="PhotoSphera"><span class="optical-star" aria-hidden="true"></span></div></header>
<main>
<section id="feed" aria-label="Feed"><span class="lens feed-watermark" aria-hidden="true"></span><div class="feed-heading" id="feed-heading">Publicações</div>
<div id="story-strip" class="story-strip" role="group" aria-label="Últimas fotos" hidden></div><div id="received-photos"></div><div id="demo-photos" hidden></div><div id="local"></div><p id="feed-empty" class="pad muted" role="status">Carregando publicações…</p><div class="feed-tools"><button class="action" id="feed-edit-profile" type="button"> <span class="tool-icon profile-icon" aria-hidden="true"></span>Editar perfil</button><button class="action" id="feed-install-app" type="button"><span class="tool-icon download-icon" aria-hidden="true">↓</span>Instalar app</button></div><p class="feed-tools-status muted" id="feed-tools-status" role="status"></p>
</section>
<section id="publish" class="pad" hidden><h2>Publicar</h2><p class="muted">Fotos aparecem no feed dos seus contatos. Vídeos ficam neste aparelho.</p><form id="composer"><label>Foto ou vídeo<input name="file" type="file" accept="image/*,video/*" required></label><label>Legenda<textarea name="caption" rows="3" maxlength="400"></textarea></label><label>Nota de composição (opcional)<textarea name="composition" rows="2" maxlength="400" placeholder="O que orientou seu enquadramento?"></textarea></label><button class="action gold">Publicar</button><p id="notice" role="status"></p></form></section>
<section id="profile" class="pad" hidden><h2 id="profile-name">Meu perfil</h2><img id="profile-photo" width="64" height="64" alt="Foto do perfil" hidden style="border-radius:50%;object-fit:cover;margin-top:10px"><div class="share-row"><button class="action" id="edit-profile">Editar perfil</button></div><div class="share-row"><button class="action" id="invite">Compartilhar app</button><button class="action" id="install-app">Instalar app</button><button class="action" id="shutter-sound" aria-pressed="true">Som do obturador</button></div><p id="invite-status" class="share-status muted" role="status"></p><h3>Conexões</h3><div class="share-row"><button class="action gold" id="copy-invite">Criar convite</button><button class="action gold" id="accept-invite" hidden>Ver convite recebido</button></div><input id="connection-link" aria-label="Link para conectar" readonly hidden><p id="connection-status" class="muted" role="status"></p><p id="connections-list" class="muted">Você ainda não tem conexões.</p><p id="empty" class="muted">Suas publicações da prévia aparecem aqui.</p><div id="mine"></div></section>
</main><dialog id="contact-gallery"><div class="dialogbar"><h2 id="gallery-title"></h2><form method="dialog"><button class="action">Fechar</button></form></div><div id="gallery-content"></div><p id="gallery-status" role="status"></p><button class="action" id="gallery-more">Carregar mais</button></dialog>
<nav class="bottom" aria-label="Navegação principal"><button data-view="feed" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>Feed</button><button data-view="publish"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8m-4-4h8"/></svg>Publicar</button><button data-view="profile"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg>Perfil</button></nav>
<dialog id="card-dialog" aria-label="Prévia do cartão PhotoSphera"><div class="dialogbar"><h2>Cartão PhotoSphera</h2><form method="dialog"><button class="action">Fechar</button></form></div><img class="moment" id="card-image" alt="Prévia do cartão assinado"><p id="card-status" role="status"></p><div class="share-row"><button class="action gold" id="card-share">Compartilhar</button><button class="action" id="card-download">Baixar cartão</button></div></dialog><dialog id="profile-editor"><form id="profile-form"><h2>Editar perfil</h2><label>Nome<input name="name" required maxlength="60"></label><label>Foto de perfil<input name="photo" type="file" accept="image/*"></label><p id="profile-status" role="status"></p><button class="action gold">Salvar perfil</button> <button class="action" type="button" id="cancel-profile">Cancelar</button></form></dialog>
<dialog id="reply"><div class="dialogbar"><h2>Deixar uma impressão</h2><form method="dialog"><button class="action">Fechar</button></form></div><form id="commentForm"><label>Sua impressão<textarea name="comment" maxlength="300" rows="3" required></textarea></label><button class="action gold">Adicionar</button></form></dialog>
<script>
const byId = id => document.getElementById(id);
const tabs = [...document.querySelectorAll('[data-view]')];
function openView(view) {
  for (const tab of tabs) {
    const selected = tab.dataset.view === view;
    byId(tab.dataset.view).hidden = !selected;
    if (selected) tab.setAttribute('aria-current', 'page');
    else tab.removeAttribute('aria-current');
  }
  window.scrollTo(0,0);
}
tabs.forEach(tab => tab.onclick = () => openView(tab.dataset.view));
let commentTarget;
document.addEventListener('click', event => {
  const trigger = event.target.closest('.impression');
  if (!trigger) return;
  commentTarget = trigger.closest('article').querySelector('.comments');
  byId('commentForm').reset();
  byId('reply').showModal();
});
byId('commentForm').onsubmit = event => {
  event.preventDefault();
  const value = new FormData(event.currentTarget).get('comment').trim();
  if (!value) return;
  const comment = document.createElement('p');
  comment.textContent = 'Você · ' + value;
  commentTarget.append(comment);
  byId('reply').close();
};
function setAuthor(author, name, portrait) {
  const avatar = document.createElement('span');
  avatar.className = 'author-avatar';
  avatar.setAttribute('aria-hidden', 'true');
  if (portrait) {
    const photo = document.createElement('img');
    photo.src = portrait;
    photo.alt = '';
    avatar.append(photo);
  } else {
    avatar.dataset.initials = name.trim().split(/\s+/).slice(0, 2).map(word => word[0]).join('').toLocaleUpperCase('pt-BR');
  }
  author.replaceChildren(avatar, document.createTextNode(name));
}
function publication(url, isVideo, caption) {
  const post = document.createElement('article');
  const author = document.createElement('div');
  author.className = 'author';
  author.classList.add('local-author');
  setAuthor(author, profile.name || 'Você', profile.photo);
  const media = document.createElement(isVideo ? 'video' : 'img');
  media.className = 'media';
  media.src = url;
  if (isVideo) {
    media.controls = true;
    media.playsInline = true;
    media.preload = 'metadata';
  } else media.alt = caption || 'Foto publicada na prévia';
  const details = document.createElement('div');
  details.className = 'pad';
  const text = document.createElement('p');
  text.className = 'caption';
  text.textContent = caption;
  const button = document.createElement('button');
  button.className = 'action gold impression';
  button.textContent = 'Impressão';
  const comments = document.createElement('div');
  comments.className = 'comments';
  comments.setAttribute('aria-live','polite');
  if (caption) details.append(text);
  details.append(button, comments);
  post.append(author, media, details);
  return post;
}
let profile = {};
try { profile = JSON.parse(localStorage.getItem('photosfera-profile-comecar')) || {}; } catch {}
function showProfile() {
  byId('profile-name').textContent = profile.name || 'Meu perfil';
  const photo = byId('profile-photo');
  photo.hidden = !profile.photo;
  if (profile.photo) photo.src = profile.photo;
  for (const author of document.querySelectorAll('.local-author')) setAuthor(author, profile.name || 'Você', profile.photo);
}

}

async function readExif(file) {
  const d = new DataView(await file.arrayBuffer());
  if (d.byteLength < 4 || d.getUint16(0) !== 0xffd8) return [];
  for (let p = 2; p + 10 <= d.byteLength;) {
    const marker = d.getUint16(p), size = d.getUint16(p+2), end = p+2+size;
    if (marker === 0xffda || size < 2 || end > d.byteLength) break;
    if (marker === 0xffe1 && size >= 16 && d.getUint32(p+4) === 0x45786966 && !d.getUint16(p+8)) {
      const t = new DataView(d.buffer,p+10,end-p-10);
      const le = t.getUint16(0) === 0x4949;
      if (t.getUint16(2,le) !== 42) break;
      const values = new Map();
      const tags = new Set([271,272,34665,33434,33437,34855,37386,41988,41989,42036]);
      function directory(start) {
        const count = t.getUint16(start,le);
        for (let i=0; i<count; i++) {
          const pos=start+2+i*12, tag=t.getUint16(pos,le);
          if (!tags.has(tag)) continue;
          const type=t.getUint16(pos+2,le), count=t.getUint32(pos+4,le);
          const width={2:1,3:2,4:4,5:8}[type];
          if (!width || !count || count>512) continue;
          const ptr=width*count<=4 ? pos+8 : t.getUint32(pos+8,le);
          if (ptr+width*count>t.byteLength) continue;
          let v;
          if (type===2) v=new TextDecoder().decode(new Uint8Array(t.buffer,t.byteOffset+ptr,count)).split('\0')[0].trim();
          if (type===3) v=t.getUint16(ptr,le);
          if (type===4) v=t.getUint32(ptr,le);
          if (type===5) v=t.getUint32(ptr,le)/t.getUint32(ptr+4,le);
          if (v && (typeof v==='string' || Number.isFinite(v))) values.set(tag,v);
        }
      }
      directory(t.getUint32(4,le));
      if (values.has(34665)) directory(values.get(34665));
      const v = tag => values.get(tag);
      const shutter=v(33434);
      return [
        ['Câmera',[v(271),v(272)].filter(Boolean).join(' ')],['Lente',v(42036)],
        ['Distância focal',v(37386) && v(37386)+' mm'],['Equivalente em 35 mm',v(41989) && v(41989)+' mm'],
        ['Abertura',v(33437) && 'ƒ/'+v(33437)],['Velocidade',shutter && (shutter<1 ? '1/'+Math.round(1/shutter) : shutter)+' s'],
        ['ISO',v(34855)],['Zoom digital',v(41988) && v(41988)+'×']
      ].filter(([,value])=>value);
    }
    p=end;
  }
  return [];
}

  try {
    await photo.decode();
    const canvas=document.createElement('canvas');
    const scale=Math.min(1,1600/Math.max(photo.naturalWidth,photo.naturalHeight));
    const width=Math.max(1,Math.round(photo.naturalWidth*scale));
    const height=Math.max(1,Math.round(photo.naturalHeight*scale));
    const ctx=canvas.getContext('2d');
    canvas.width=Math.max(600,width);
    const unit=canvas.width/36;
    const lines=[];
    ctx.font=unit+'px Georgia';
    for (const word of caption.match(/\S+/gu)||[]) {
      const previous=lines.at(-1);
      if(previous && ctx.measureText(previous+' '+word).width<canvas.width-2*unit) lines[lines.length-1]+=' '+word;
      else lines.push(word);
    }
    canvas.height=height+Math.ceil(unit*(3.5+Math.min(lines.length,6)*1.45));
    ctx.fillStyle='#17171b';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(photo,(canvas.width-width)/2,0,width,height);
    ctx.font=unit+'px Georgia';ctx.fillStyle='#dddde5';
    lines.slice(0,6).forEach((line,i)=>ctx.fillText(i===5&&lines.length>6?line+'…':line,unit,height+unit*(1.45+i*1.45),canvas.width-2*unit));
    const y=canvas.height-unit;
    ctx.font=unit*1.25+'px system-ui';
    ctx.fillText('Photo',unit,y);
    const offset=ctx.measureText('Photo').width;
    ctx.font='italic '+unit*1.45+'px Georgia';ctx.fillStyle='#e9c27e';
    ctx.fillText('Sphera',unit+offset,y);
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.92));
    if(request!==cardRequest || !byId('card-dialog').open) return;
    if(!blob) throw Error('JPEG');
    cardFile=new File([blob],'PhotoSphera.jpg',{type:'image/jpeg'});
    cardUrl=URL.createObjectURL(cardFile);
    byId('card-image').src=cardUrl;
    byId('card-share').disabled=false;
    byId('card-download').disabled=false;
    byId('card-status').textContent='';
  } catch { if(request===cardRequest) byId('card-status').textContent='Não foi possível gerar o cartão desta foto.'; }
}

  actions.append(post.querySelector('.impression'),share);
  if (!isVideo) {
    const publishing = document.createElement('div');
    publishing.className = 'post-publishing';
    const publicationStatus = document.createElement('p');
    publicationStatus.className = 'muted';
    publicationStatus.setAttribute('role', 'status');
    more.append(publishing);
    const send = document.createElement('button');
    send.className = 'action publish-to-contacts';
    send.textContent = 'Publicar para os contatos';
    send.hidden = Boolean(publishedToContacts);
    if (publishedToContacts) publicationStatus.textContent = 'Visível aos contatos';
    send.onclick = async () => {
      send.disabled = true;
      publicationStatus.textContent = 'Publicando…';
      try {
        await publishToContacts(file, caption, composition);
        publicationStatus.textContent = 'Visível aos contatos';
        send.hidden = true;
        await posts('readwrite', store => store.put({...record, publishedToContacts: true}, key))
          .catch(() => {
            publicationStatus.textContent = 'Visível aos contatos. O status não foi salvo neste aparelho.';
          });
      } catch (error) {
        more.open = true;
        publicationStatus.textContent = connectionError(error);
      } finally {
        send.disabled = false;
      }
    };
    publishing.append(send, publicationStatus);
  }
  byId('local').prepend(post);
  byId('feed-empty').hidden = true;
  const link = document.createElement('button');
  link.className = 'action';
  link.textContent = caption || (isVideo ? 'Meu vídeo' : 'Minha foto');
  link.onclick = () => {
    openView('feed');
    highlightPost(post);
    post.scrollIntoView();
  };
  byId('mine').prepend(link);
  byId('empty').hidden = true;
  return post;
}
let restoredKeys;
const restored = posts('readonly', store => {
  restoredKeys = store.getAllKeys();
  return store.getAll();
}).then(records => {
  records.forEach((record, index) => showPost(record, restoredKeys.result[index]));
  (async () => {
    for (const record of records) {
      if (record.publishedToContacts && record.file.type.startsWith('image/')) {
        try { await publishToContacts(record.file, record.caption, record.composition); } catch {}
      }
    }
  })();
  if (selectedPost?.parentElement !== byId('local')) {
    selectedPost = null;
    selectedContact = null;
  }
  renderStories();
  byId('feed-empty').hidden = true;
}).catch(() => {
  byId('feed-empty').textContent = 'Não foi possível carregar suas publicações.';
  byId('notice').textContent = 'Não foi possível acessar as publicações deste navegador.';
});
byId('composer').onsubmit = async event => {
  event.preventDefault();
  const form = event.currentTarget;
  const data = new FormData(form);
  const file = data.get('file');
  if (!/^(image|video)\//.test(file.type)) {
    byId('notice').textContent = 'Escolha uma foto ou um vídeo.';
    return;
  }
  const submit = form.querySelector('button[type="submit"], button');
  playShutter();
  submit.disabled = true;
  const record = {file, caption: data.get('caption').trim(), composition: file.type.startsWith('image/') ? data.get('composition').trim() : ''};
  try {
    await restored;
    const key = await posts('readwrite', store => store.add(record));
    const post = showPost(record, key);
    highlightPost(post);
    renderStories();
    form.reset();
    byId('notice').textContent = '';
    openView('feed');
    if (file.type.startsWith('image/')) {
      post.querySelector('.publish-to-contacts').click();
    }
  } catch {
    byId('notice').textContent = 'Não foi possível salvar neste navegador. Verifique o espaço disponível.';
  } finally {
    submit.disabled = false;
  }
};
let installPrompt;
const installButton = byId('install-app');
const feedInstallButton = byId('feed-install-app');
byId('feed-edit-profile').onclick = () => byId('edit-profile').click();
window.addEventListener('beforeinstallprompt', event => {
  event.preventDefault();
  installPrompt = event;
});
function hideInstalled() { installButton.hidden = feedInstallButton.hidden = true; }
if (matchMedia('(display-mode: standalone)').matches || navigator.standalone) hideInstalled();
window.addEventListener('appinstalled', hideInstalled);
installButton.onclick = feedInstallButton.onclick = async event => {
  const installStatus = event.currentTarget === feedInstallButton ? byId('feed-tools-status') : byId('invite-status');
  if (installPrompt) {
    const prompt = installPrompt;
    installPrompt = null;
    try {
      await prompt.prompt();
      return;
    } catch {}
  }
  installStatus.textContent = /iPhone|iPad/i.test(navigator.userAgent)
    ? 'No Safari, toque em Compartilhar → Adicionar à Tela de Início.'
    : 'Abra no Chrome e escolha Instalar app ou Adicionar à tela inicial no menu.';
};
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
</script></body></html>
