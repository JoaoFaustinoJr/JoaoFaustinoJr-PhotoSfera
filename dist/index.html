main{padding-bottom:100px}section[hidden]{display:none}h1,h2{font-family:Georgia,serif;font-weight:normal;margin:0}h2{font-size:25px}.pad{padding:20px 22px}.esferas{display:flex;gap:16px;overflow:auto;padding:3px}.sphere{flex:1;min-width:60px;padding:0;border:0;background:none;font-size:13px}.sphere img{display:block;width:100%;max-width:98px;aspect-ratio:1;object-fit:cover;border-radius:50%;border:1px solid #e6ba6b;padding:2px;margin:0 auto}.sphere.seen img{border-color:#a5a3af}.author{display:flex;gap:12px;align-items:center;border-top:1px solid #38363b;padding:14px 22px}.author img{width:44px;height:44px;border-radius:50%}.author small,.muted{color:#b9b5bf}.media{width:100%;display:block;max-height:70dvh;object-fit:contain;background:#101013}.gold{color:#edc77f}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid #edc77f;outline-offset:3px}.action{background:#222126;border:1px solid #665b49;border-radius:9px;padding:10px 14px}.caption{font:20px Georgia,serif}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);background:#17171b;border-top:1px solid #514d55;display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:2}.bottom button{flex:1;background:none;border:0;padding:10px 3px;font-size:13px}.bottom button span{display:block;font-size:24px;line-height:1}.bottom [aria-current=page]{color:#edc77f}label{display:block;margin:16px 0}input,textarea{display:block;width:100%;margin-top:6px;padding:9px;border:1px solid #665b61;background:#27252b;border-radius:8px;font:inherit;color:inherit}dialog{max-width:min(95vw,490px);width:100%;background:#201f24;color:#eee;border:1px solid #a7a1a8;border-radius:12px}dialog::backdrop{background:#000c}.dialogbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.dialogbar h2{font-size:21px}.moment{display:block;width:100%;max-height:67dvh;object-fit:contain}.row{display:flex;justify-content:space-between;margin-top:12px;gap:6px}

header{container-type:inline-size;padding:14px 16px 12px;background:#17171b;border-bottom:1px solid #3d3837}
#feed>.pad{padding:12px 16px}
.esferas{justify-content:space-between;gap:12px}
.sphere{min-width:44px;max-width:77px}
.author{padding:10px 16px}
img.media{height:auto;max-height:none}

.bottom button{min-height:52px}

.bottom svg{display:block;width:23px;height:23px;margin:0 auto 4px}
.caption{margin:0 0 8px;line-height:1.35}
.impression{background:transparent;border-color:transparent;padding:10px 0;min-height:44px;font-size:14px;color:#d5b783}
.impression:hover{text-decoration:underline;text-underline-offset:4px}
.wordmark em::after{content:"";position:absolute;pointer-events:none;left:52%;top:48%;width:.48em;height:.48em;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#fff8e4 0%,#f7d697dd 13%,#e0af6277 32%,transparent 71%);z-index:-1}

</style></head><body>
<header><div class="wordmark" aria-label="PhotoSfera"><span class="wordmark-photo">Photo</span><em>Sfera</em></div></header>
<main>
<section id="feed" aria-label="Feed">
<div class="pad"><div class="esferas" id="esferas" role="group" aria-label="Momentos recentes"></div></div>
<div id="local"></div>
<article><div class="author"><img src="avatar.webp" alt=""><div><strong>Clara Mendes</strong><br><small>Jaboti, PR · exemplo</small></div></div>
<img class="media" src="serra.webp" width="992" height="677" alt="Neblina entre colinas e araucárias ao amanhecer">
<div class="pad"><p class="caption">A serra antes de acordar.</p><button class="action gold impression" type="button">Deixar uma impressão</button><div class="comments" aria-live="polite"></div></div></article>
</section>
<section id="publish" class="pad" hidden><h2>Publicar</h2><p class="muted">As publicações ficam salvas neste navegador.</p><form id="composer"><label>Foto ou vídeo<input name="file" type="file" accept="image/*,video/*" required></label><label>Legenda<textarea name="caption" rows="3" maxlength="400"></textarea></label><button class="action gold">Publicar neste aparelho</button><p id="notice" role="status"></p></form></section>
<section id="profile" class="pad" hidden><h2>Meu perfil</h2><div class="share-row"><button class="action" id="invite">Convidar amigos</button><button class="action" id="shutter-sound" aria-pressed="true">Som do obturador</button></div><p id="invite-status" class="share-status muted" role="status"></p><p id="empty" class="muted">Suas publicações da prévia aparecem aqui.</p><div id="mine"></div></section>
</main>
<nav class="bottom" aria-label="Navegação principal"><button data-view="feed" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>Feed</button><button data-view="publish"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8m-4-4h8"/></svg>Publicar</button><button data-view="profile"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg>Perfil</button></nav>
<dialog id="moment"><div class="dialogbar"><h2 id="momentTitle"></h2><form method="dialog"><button class="action">Fechar</button></form></div><img class="moment" id="momentImage" alt=""><div class="row"><button class="action" id="previous">Anterior</button><button class="action" id="next">Próxima</button></div><p class="muted">Prévia ilustrativa</p></dialog>
<dialog id="reply"><div class="dialogbar"><h2>Deixar uma impressão</h2><form method="dialog"><button class="action">Fechar</button></form></div><form id="commentForm"><label>Sua impressão<textarea name="comment" maxlength="300" rows="3" required></textarea></label><button class="action gold">Adicionar</button></form></dialog>
<script>
const byId = id => document.getElementById(id);
const tabs = [...document.querySelectorAll('[data-view]')];
function openView(view) {
  for (const tab of tabs) {
    const selected = tab.dataset.view === view;
    byId(tab.dataset.view).hidden = !selected;
    if (selected) tab.setAttribute('aria-current', 'page');
    else tab.removeAttribute('aria-current');
  }
  window.scrollTo(0,0);
}
tabs.forEach(tab => tab.onclick = () => openView(tab.dataset.view));
const spheres = [['Lia','lia'], ['Rafael','rafael'], ['Clara','clara'], ['João','joao']];
const seen = new Set([1,3]);
const sphereButtons = spheres.map(([name, image], index) => {
  const button = document.createElement('button');
  button.className = seen.has(index) ? 'sphere seen' : 'sphere';
  const preview = new Image();
  preview.src = image + '.webp';
  preview.alt = '';
  button.setAttribute('aria-label', 'Ver momento de ' + name);
  button.append(preview);
  button.onclick = () => showSphere(index);
  byId('esferas').append(button);
  return button;
});
let activeSphere = 0;
function showSphere(index) {
  activeSphere = (index + spheres.length) % spheres.length;
  const [name, image] = spheres[activeSphere];
  byId('momentTitle').textContent = name;
  byId('momentImage').src = image + '.webp';
  sphereButtons[activeSphere].classList.add('seen');
  if (!byId('moment').open) byId('moment').showModal();
}
byId('previous').onclick = () => showSphere(activeSphere - 1);
byId('next').onclick = () => showSphere(activeSphere + 1);
let commentTarget;
document.addEventListener('click', event => {
  const trigger = event.target.closest('.impression');
  if (!trigger) return;
  commentTarget = trigger.closest('article').querySelector('.comments');
  byId('commentForm').reset();
  byId('reply').showModal();
});
byId('commentForm').onsubmit = event => {
  event.preventDefault();
  const value = new FormData(event.currentTarget).get('comment').trim();
  if (!value) return;
  const comment = document.createElement('p');
  comment.textContent = 'Você · ' + value;
  commentTarget.append(comment);
  byId('reply').close();
};
function publication(url, isVideo, caption) {
  const post = document.createElement('article');
  const author = document.createElement('div');
  author.className = 'author';
  author.textContent = 'Você';
  const media = document.createElement(isVideo ? 'video' : 'img');
  media.className = 'media';
  media.src = url;
  if (isVideo) {
    media.controls = true;
    media.playsInline = true;
    media.preload = 'metadata';
  } else media.alt = caption || 'Foto publicada na prévia';
  const details = document.createElement('div');
  details.className = 'pad';
  const text = document.createElement('p');
  text.className = 'caption';
  text.textContent = caption;
  const button = document.createElement('button');
  button.className = 'action gold impression';
  button.textContent = 'Deixar uma impressão';
  const comments = document.createElement('div');
  comments.className = 'comments';
  comments.setAttribute('aria-live','polite');
  if (caption) details.append(text);
  details.append(button, comments);
  post.append(author, media, details);
  return post;
}
const database = new Promise((resolve, reject) => {
  const request = indexedDB.open('photosfera', 1);
  request.onupgradeneeded = () => request.result.createObjectStore('posts', {autoIncrement: true});
  request.onsuccess = () => resolve(request.result);
  request.onerror = () => reject(request.error);
});
async function posts(mode, action) {
  const db = await database;
  return new Promise((resolve, reject) => {
    const transaction = db.transaction('posts', mode);
    const request = action(transaction.objectStore('posts'));
    transaction.oncomplete = () => resolve(request.result);
    transaction.onabort = () => reject(transaction.error);
  });
}
let inviteIcon;
async function loadInviteIcon() {
  try {
    const response = await fetch(new URL('../obturador.png', location.href));
    if (!response.ok) return;
    const image = await response.blob();
    if (image.type === 'image/png') inviteIcon = new File([image], 'PhotoSfera.png', {type: 'image/png'});
  } catch {}
}
loadInviteIcon();
byId('invite').onclick = async () => {
  const url = new URL('../?convite=2', location.href).href;
  const status = byId('invite-status');
  try {
    if (navigator.share) {
      const link = {title:'PhotoSfera', text:'Conheça o PhotoSfera.', url};
      const card = inviteIcon && {title:'PhotoSfera', text:'Conheça o PhotoSfera. ' + url, files:[inviteIcon]};
      await navigator.share(card && navigator.canShare?.(card) ? card : link);
    }
    else {
      await navigator.clipboard.writeText(url);
      status.textContent = 'Link copiado. Cole na conversa do RAI Connect.';
    }
  } catch (error) {
    if (error.name !== 'AbortError') status.textContent = 'Link do PhotoSfera: ' + url;
  }
};
const soundButton = byId('shutter-sound');

const testSound = document.createElement('button');
testSound.className = 'action';

soundButton.after(testSound);
const soundStatus = document.createElement('p');
soundStatus.setAttribute('role','status');
soundButton.parentElement.after(soundStatus);
function updateSound() {
  soundButton.setAttribute('aria-pressed', soundEnabled);
  soundButton.textContent = soundEnabled ? 'Som ligado' : 'Som desligado';
}
updateSound();
soundButton.onclick = () => {
  soundEnabled = !soundEnabled;
  localStorage.setItem('photosfera-muted', soundEnabled ? '0' : '1');
  updateSound();
  if (soundEnabled) playShutter(true);
};
testSound.onclick = () => playShutter(true);
function playShutter(test = false) {
  if (!test && !soundEnabled) return;
  soundStatus.textContent = '';
  shutter.currentTime = 0;
  shutter.play().catch(() => {
    soundStatus.textContent = 'O navegador bloqueou o áudio. Tente abrir o PhotoSfera no Chrome.';
  });
}
function showPost({file, caption}) {
  const isVideo = file.type.startsWith('video/');
  const post = publication(URL.createObjectURL(file), isVideo, caption);
  const share = document.createElement('button');
  share.className = 'action';
  share.textContent = 'Compartilhar arquivo';
  const status = document.createElement('p');
  status.className = 'share-status muted';
  status.setAttribute('role', 'status');
  share.onclick = async () => {
    const payload = {files:[file]};
    try {
      if (navigator.canShare?.(payload)) {
        await navigator.share(caption ? {...payload,text:caption} : payload);
      } else {
        const download = document.createElement('a');
        download.href = post.querySelector('.media').src;
        download.download = file.name;
        download.click();
        status.textContent = 'Arquivo baixado. Você pode anexá-lo em uma conversa.';
      }
    } catch (error) {
      if (error.name !== 'AbortError') status.textContent = 'Não foi possível compartilhar este arquivo.';
    }
  };
  post.querySelector('.comments').before(share, status);
  byId('local').prepend(post);
  const link = document.createElement('button');
  link.className = 'action';
  link.textContent = caption || (isVideo ? 'Meu vídeo' : 'Minha foto');
  link.onclick = () => {
    openView('feed');
    post.scrollIntoView();
  };
  byId('mine').prepend(link);
  byId('empty').hidden = true;
}
const restored = posts('readonly', store => store.getAll()).then(records => records.forEach(showPost)).catch(() => {
  byId('notice').textContent = 'Não foi possível acessar as publicações deste navegador.';
});
byId('composer').onsubmit = async event => {
  event.preventDefault();
  const form = event.currentTarget;
  const data = new FormData(form);
  const file = data.get('file');
  if (!/^(image|video)\//.test(file.type)) {
    byId('notice').textContent = 'Escolha uma foto ou um vídeo.';
    return;
  }
  const submit = form.querySelector('button[type="submit"], button');
  playShutter();
  submit.disabled = true;
  const record = {file, caption: data.get('caption').trim()};
  try {
    await restored;
    await posts('readwrite', store => store.add(record));
    showPost(record);
    form.reset();
    byId('notice').textContent = '';
    openView('feed');
  } catch {
    byId('notice').textContent = 'Não foi possível salvar neste navegador. Verifique o espaço disponível.';
  } finally {
    submit.disabled = false;
  }
};
