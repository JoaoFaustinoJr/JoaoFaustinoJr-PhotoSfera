main{padding-bottom:100px}section[hidden]{display:none}h1,h2{font-family:Georgia,serif;font-weight:normal;margin:0}h2{font-size:25px}.pad{padding:20px 22px}.esferas{display:flex;gap:16px;overflow:auto;padding:3px}.sphere{flex:1;min-width:60px;padding:0;border:0;background:none;font-size:13px}.sphere img{display:block;width:100%;max-width:98px;aspect-ratio:1;object-fit:cover;border-radius:50%;border:1px solid #e6ba6b;padding:2px;margin:0 auto}.sphere.seen img{border-color:#a5a3af}.author{display:flex;gap:12px;align-items:center;border-top:1px solid #38363b;padding:14px 22px}.author img{width:44px;height:44px;border-radius:50%}.author small,.muted{color:#b9b5bf}.media{width:100%;display:block;max-height:70dvh;object-fit:contain;background:#101013}.gold{color:#edc77f}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid #edc77f;outline-offset:3px}.action{background:#222126;border:1px solid #665b49;border-radius:9px;padding:10px 14px}.caption{font:20px Georgia,serif}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);background:#17171b;border-top:1px solid #514d55;display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:2}.bottom button{flex:1;background:none;border:0;padding:10px 3px;font-size:13px}.bottom button span{display:block;font-size:24px;line-height:1}.bottom [aria-current=page]{color:#edc77f}label{display:block;margin:16px 0}input,textarea{display:block;width:100%;margin-top:6px;padding:9px;border:1px solid #665b61;background:#27252b;border-radius:8px;font:inherit;color:inherit}dialog{max-width:min(95vw,490px);width:100%;background:#201f24;color:#eee;border:1px solid #a7a1a8;border-radius:12px}dialog::backdrop{background:#000c}.dialogbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.dialogbar h2{font-size:21px}.moment{display:block;width:100%;max-height:67dvh;object-fit:contain}.row{display:flex;justify-content:space <header><div class="wordmark" aria-label="PhotoSfera"><span class="wordmark-photo">Photo</span><em>Sfera</em></div></header>
<main>
<section id="feed" aria-label="Feed">
<div id="local"></div><p id="feed-empty" class="pad muted" role="status">Carregando publicações…</p>
</section>
<section id="publish" class="pad" hidden><h2>Publicar</h2><p class="muted">As publicações ficam salvas neste navegador.</p><form id="composer"><label>Foto ou vídeo<input name="file" type="file" accept="image/*,video/*" required></label><label>Legenda<textarea name="caption" rows="3" maxlength="400"></textarea></label><label>Nota de composição (opcional)<textarea name="composition" rows="2" maxlength="400" placeholder="O que orientou seu enquadramento?"></textarea></label><button class="action gold">Publicar neste aparelho</button><p id="notice" role="status"></p></form></section>
<section id="profile" class="pad" hidden><h2 id="profile-name">Meu perfil</h2><img id="profile-photo" width="64" height="64" alt="Foto do perfil" hidden style="border-radius:50%;object-fit:cover;margin-top:10px"><div class="share-row"><button class="action" id="edit-profile">Editar perfil</button><button class="action" id="copy-invite">Copiar link</button></div><div class="share-row"><button class="action" id="invite">Compartilhar app</button><button class="action" id="install-app">Instalar app</button><button class="action" id="shutter-sound" aria-pressed="true">Som do obturador</button></div><p id="invite-status" class="share-status muted" role="status"></p><p id="empty" class="muted">Suas publicações da prévia aparecem aqui.</p><div id="mine"></div></section>
</main>
<nav class="bottom" aria-label="Navegação principal"><button data-view="feed" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>Feed</button><button data-view="publish"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8m-4-4h8"/></svg>Publicar</button><button data-view="profile"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg>Perfil</button></nav>
<dialog id="card-dialog" aria-label="Prévia do cartão PhotoSfera"><div class="dialogbar"><h2>Cartão PhotoSfera</h2><form method="dialog"><button class="action">Fechar</button></form></div><img class="moment" id="card-image" alt="Prévia do cartão assinado"><p id="card-status" role="status"></p><div class="share-row"><button class="action gold" id="card-share">Compartilhar</button><button class="action" id="card-download">Baixar cartão</button></div></dialog><dialog id="profile-editor"><form id="profile-form"><h2>Editar perfil</h2><label>Nome<input name="name" required maxlength="60"></label><label>Foto de perfil<input name="photo" type="file" accept="image/*"></label><p id="profile-status" role="status"></p><button class="action gold">Salvar perfil</button> <button class="action" type="button" id="cancel-profile">Cancelar</button></form></dialog>
<dialog id="reply"><div class="dialogbar"><h2>Deixar uma impressão</h2><form method="dialog"><button class="action">Fechar</button></form></div><form id="commentForm"><label>Sua impressão<textarea name="comment" maxlength="300" rows="3" required></textarea></label><button class="action gold">Adicionar</button></form></dialog>
<script>
const byId = id => document.getElementById(id);
const tabs = [...document.querySelectorAll('[data-view]')];
function openView(view) {
  for (const tab of tabs) {
    const selected = tab.dataset.view === view;
    byId(tab.dataset.view).hidden = !selected;
    if (selected) tab.setAttribute('aria-current', 'page');
    else tab.removeAttribute('aria-current');
  }
  window.scrollTo(0,0);
}
tabs.forEach(tab => tab.onclick = () => openView(tab.dataset.view));
let commentTarget;
document.addEventListener('click', event => {
  const trigger = event.target.closest('.impression');
  if (!trigger) return;
  commentTarget = trigger.closest('article').querySelector('.comments');
  byId('commentForm').reset();
  byId('reply').showModal();
});
byId('commentForm').onsubmit = event => {
  event.preventDefault();
  const value = new FormData(event.currentTarget).get('comment').trim();
  if (!value) return;
  const comment = document.createElement('p');
  comment.textContent = 'Você · ' + value;
  commentTarget.append(comment);
  byId('reply').close();
};
function publication(url, isVideo, caption) {
  const post = document.createElement('article');
  const author = document.createElement('div');
  author.className = 'author';
  author.classList.add('local-author');
  author.textContent = profile.name || 'Você';
  const media = document.createElement(isVideo ? 'video' : 'img');
  media.className = 'media';
  media.src = url;
  if (isVideo) {
    media.controls = true;
    media.playsInline = true;
    media.preload = 'metadata';
  } else media.alt = caption || 'Foto publicada na prévia';
  const details = document.createElement('div');
  details.className = 'pad';
  const text = document.createElement('p');
  text.className = 'caption';
  text.textContent = caption;
  const button = document.createElement('button');
  button.className = 'action gold impression';
  button.textContent = 'Deixar uma impressão';
  const comments = document.createElement('div');
  comments.className = 'comments';
  comments.setAttribute('aria-live','polite');
  if (caption) details.append(text);
  details.append(button, comments);
  post.append(author, media, details);
  return post;
}
let profile = {};
try { profile = JSON.parse(localStorage.getItem('photosfera-profile')) || {}; } catch {}
function showProfile() {
  byId('profile-name').textContent = profile.name || 'Meu perfil';
  const photo = byId('profile-photo');
  photo.hidden = !profile.photo;
  if (profile.photo) photo.src = profile.photo;
  for (const author of document.querySelectorAll('.local-author')) author.textContent = profile.name || 'Você';
}
showProfile();
const editor = byId('profile-editor');
const profileForm = byId('profile-form');
byId('edit-profile').onclick = () => {
  profileForm.reset();
  profileForm.elements.name.value = profile.name || '';
  byId('profile-status').textContent = '';
  editor.showModal();
};
byId('cancel-profile').onclick = () => editor.close();
profileForm.onsubmit = async event => {
  event.preventDefault();
  const name = profileForm.elements.name.value.trim();
  if (!name) { byId('profile-status').textContent = 'Digite seu nome.'; return; }
  const save = profileForm.querySelector('button');
  save.disabled = true;
  const file = profileForm.elements.photo.files[0];
  try {
    let photo = profile.photo;
    if (file) {
      const image = await createImageBitmap(file);
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 256;
      const side = Math.min(image.width, image.height);
      canvas.getContext('2d').drawImage(image,(image.width-side)/2,(image.height-side)/2,side,side,0,0,256,256);
      image.close();
      photo = canvas.toDataURL('image/jpeg',.86);
    }
    localStorage.setItem('photosfera-profile',JSON.stringify({name,photo}));
    profile = {name,photo};
    showProfile();
    editor.close();
  } catch { byId('profile-status').textContent = 'Não foi possível salvar. Tente uma foto JPG ou PNG.'; }
  finally { save.disabled = false; }
};
const database = new Promise((resolve, reject) => {
  const request = indexedDB.open('photosfera', 1);
  request.onupgradeneeded = () => request.result.createObjectStore('posts', {autoIncrement: true});
  request.onsuccess = () => resolve(request.result);
  request.onerror = () => reject(request.error);
});
async function posts(mode, action) {
  const db = await database;
  return new Promise((resolve, reject) => {
    const transaction = db.transaction('posts', mode);
    const request = action(transaction.objectStore('posts'));
    transaction.oncomplete = () => resolve(request.result);
    transaction.onabort = () => reject(transaction.error);
  });
}
const inviteUrl = new URL('./?convite=5', location.href).href;
async function copyInvite() {
  const status = byId('invite-status');
  try {
    await navigator.clipboard.writeText(inviteUrl);
    status.textContent = 'Link copiado.';
  } catch {
    const link = document.createElement('input');
    link.value = inviteUrl;
    link.readOnly = true;
    link.setAttribute('aria-label','Link do convite');
    status.replaceChildren(link);
    link.focus();
    link.select();
  }
}
byId('copy-invite').onclick = copyInvite;
byId('invite').onclick = async () => {
  if (navigator.share) {
    try { await navigator.share({title:'PhotoSfera',url:inviteUrl}); return; }
    catch (error) { if (error.name === 'AbortError') return; }
  }
  await copyInvite();
};
const soundButton = byId('shutter-sound');
let soundEnabled = localStorage.getItem('photosfera-muted') !== '1';
const shutter = new Audio('./obturador.wav');
shutter.preload = 'auto';
const testSound = document.createElement('button');
testSound.className = 'action';
testSound.textContent = 'Testar obturador';
soundButton.after(testSound);
const soundStatus = document.createElement('p');
soundStatus.setAttribute('role','status');
soundButton.parentElement.after(soundStatus);
function updateSound() {
  soundButton.setAttribute('aria-pressed', soundEnabled);
  soundButton.textContent = soundEnabled ? 'Som ligado' : 'Som desligado';
}
updateSound();
soundButton.onclick = () => {
  soundEnabled = !soundEnabled;
  localStorage.setItem('photosfera-muted', soundEnabled ? '0' : '1');
  updateSound();
  if (soundEnabled) playShutter(true);
};
testSound.onclick = () => playShutter(true);
function playShutter(test = false) {
  if (!test && !soundEnabled) return;
  soundStatus.textContent = '';
  shutter.currentTime = 0;
  shutter.play().catch(() => {
    soundStatus.textContent = 'O navegador bloqueou o áudio. Tente abrir o PhotoSfera no Chrome.';
  });
}

async function photoDetails(file, note, post) {
  const panel = document.createElement('details');
  const title = document.createElement('summary');
  title.textContent = 'Ficha fotográfica';
  panel.append(title);
  post.querySelector('.impression').before(panel);
  let rows = [];
  try { rows = await readExif(file); } catch {}
  for (const [label,value] of [...rows, ...(note ? [['Nota de composição',note]] : [])]) {
    const line = document.createElement('p');
    line.textContent = label + ' · ' + value;
    panel.append(line);
  }
  if (!rows.length) {
    const line = document.createElement('p');
    line.textContent = 'Dados de captura indisponíveis neste arquivo.';
    panel.append(line);
  }
}
async function readExif(file) {
  const d = new DataView(await file.arrayBuffer());
  if (d.byteLength < 4 || d.getUint16(0) !== 0xffd8) return [];
  for (let p = 2; p + 10 <= d.byteLength;) {
    const marker = d.getUint16(p), size = d.getUint16(p+2), end = p+2+size;
    if (marker === 0xffda || size < 2 || end > d.byteLength) break;
    if (marker === 0xffe1 && size >= 16 && d.getUint32(p+4) === 0x45786966 && !d.getUint16(p+8)) {
      const t = new DataView(d.buffer,p+10,end-p-10);
      const le = t.getUint16(0) === 0x4949;
      if (t.getUint16(2,le) !== 42) break;
      const values = new Map();
      const tags = new Set([271,272,34665,33434,33437,34855,37386,41988,41989,42036]);
      function directory(start) {
        const count = t.getUint16(start,le);
        for (let i=0; i<count; i++) {
          const pos=start+2+i*12, tag=t.getUint16(pos,le);
          if (!tags.has(tag)) continue;
          const type=t.getUint16(pos+2,le), count=t.getUint32(pos+4,le);
          const width={2:1,3:2,4:4,5:8}[type];
          if (!width || !count || count>512) continue;
          const ptr=width*count<=4 ? pos+8 : t.getUint32(pos+8,le);
          if (ptr+width*count>t.byteLength) continue;
          let v;
          if (type===2) v=new TextDecoder().decode(new Uint8Array(t.buffer,t.byteOffset+ptr,count)).split('\0')[0].trim();
          if (type===3) v=t.getUint16(ptr,le);
          if (type===4) v=t.getUint32(ptr,le);
          if (type===5) v=t.getUint32(ptr,le)/t.getUint32(ptr+4,le);
          if (v && (typeof v==='string' || Number.isFinite(v))) values.set(tag,v);
        }
      }
      directory(t.getUint32(4,le));
      if (values.has(34665)) directory(values.get(34665));
      const v = tag => values.get(tag);
      const shutter=v(33434);
      return [
        ['Câmera',[v(271),v(272)].filter(Boolean).join(' ')],['Lente',v(42036)],
        ['Distância focal',v(37386) && v(37386)+' mm'],['Equivalente em 35 mm',v(41989) && v(41989)+' mm'],
        ['Abertura',v(33437) && 'ƒ/'+v(33437)],['Velocidade',shutter && (shutter<1 ? '1/'+Math.round(1/shutter) : shutter)+' s'],
        ['ISO',v(34855)],['Zoom digital',v(41988) && v(41988)+'×']
      ].filter(([,value])=>value);
    }
    p=end;
  }
  return [];
}
let cardFile, cardUrl, cardCaption, cardRequest = 0;
async function previewCard(photo, caption) {
  const request=++cardRequest;
  if(cardUrl) URL.revokeObjectURL(cardUrl);
  cardUrl=cardFile=null;
  cardCaption=caption;
  byId('card-image').removeAttribute('src');
  byId('card-share').disabled=true;
  byId('card-download').disabled=true;
  byId('card-status').textContent='Preparando cartão…';
  byId('card-dialog').showModal();
  try {
    await photo.decode();
    const canvas=document.createElement('canvas');
    const scale=Math.min(1,1600/Math.max(photo.naturalWidth,photo.naturalHeight));
    const width=Math.max(1,Math.round(photo.naturalWidth*scale));
    const height=Math.max(1,Math.round(photo.naturalHeight*scale));
    const ctx=canvas.getContext('2d');
    canvas.width=Math.max(600,width);
    const unit=canvas.width/36;
    const lines=[];
    ctx.font=unit+'px Georgia';
    for (const word of caption.match(/\S+/gu)||[]) {
      const previous=lines.at(-1);
      if(previous && ctx.measureText(previous+' '+word).width<canvas.width-2*unit) lines[lines.length-1]+=' '+word;
      else lines.push(word);
    }
    canvas.height=height+Math.ceil(unit*(3.5+Math.min(lines.length,6)*1.45));
    ctx.fillStyle='#17171b';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(photo,(canvas.width-width)/2,0,width,height);
    ctx.font=unit+'px Georgia';ctx.fillStyle='#dddde5';
    lines.slice(0,6).forEach((line,i)=>ctx.fillText(i===5&&lines.length>6?line+'…':line,unit,height+unit*(1.45+i*1.45),canvas.width-2*unit));
    const y=canvas.height-unit;
    ctx.font=unit*1.25+'px system-ui';
    ctx.fillText('Photo',unit,y);
    const offset=ctx.measureText('Photo').width;
    ctx.font='italic '+unit*1.45+'px Georgia';ctx.fillStyle='#e9c27e';
    ctx.fillText('Sfera',unit+offset,y);
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.92));
    if(request!==cardRequest || !byId('card-dialog').open) return;
    if(!blob) throw Error('JPEG');
    cardFile=new File([blob],'PhotoSfera.jpg',{type:'image/jpeg'});
    cardUrl=URL.createObjectURL(cardFile);
    byId('card-image').src=cardUrl;
    byId('card-share').disabled=false;
    byId('card-download').disabled=false;
    byId('card-status').textContent='';
  } catch { if(request===cardRequest) byId('card-status').textContent='Não foi possível gerar o cartão desta foto.'; }
}
function downloadCard() {
  if(!cardUrl) return;
  const link=document.createElement('a');
  link.href=cardUrl;link.download=cardFile.name;link.click();
}
byId('card-download').onclick=downloadCard;
byId('card-share').onclick=async()=>{
  if(!cardFile) return;
  const payload={files:[cardFile],text:[cardCaption,'PhotoSfera — Fotos, memórias e os detalhes de cada clique.'].filter(Boolean).join('\n')};
  try {
    if(navigator.canShare?.(payload)){await navigator.share(payload);return;}
  } catch(error){if(error.name==='AbortError')return;}
  downloadCard();
  byId('card-status').textContent='Cartão baixado. Anexe a imagem na conversa.';
};

function showPost({file, caption, composition}) {
  const isVideo = file.type.startsWith('video/');
  const post = publication(URL.createObjectURL(file), isVideo, caption);
  const share = document.createElement('button');
  share.className = 'action';
  share.textContent = 'Compartilhar arquivo';
  const status = document.createElement('p');
  status.className = 'share-status muted';
  status.setAttribute('role', 'status');
  share.onclick = async () => {
    const payload = {files:[file]};
    try {
      if (navigator.canShare?.(payload)) {
        await navigator.share(caption ? {...payload,text:caption} : payload);
        return;
      }
    } catch (error) {
      if (error.name === 'AbortError') return;
    }
    const download = document.createElement('a');
    download.href = post.querySelector('.media').src;
    download.download = file.name;
    download.click();
    status.textContent = 'Arquivo baixado para anexar à conversa.';
  };
  if (!isVideo) {
    share.textContent='Compartilhar cartão';
    share.onclick=()=>previewCard(post.querySelector('img.media'),caption);
    photoDetails(file,composition,post);
  }
  const actions=document.createElement('div');
  actions.className='post-actions';
  post.querySelector('.comments').before(actions,status);
  actions.append(post.querySelector('.impression'),share);
  byId('local').prepend(post);
  byId('feed-empty').hidden = true;
  const link = document.createElement('button');
  link.className = 'action';
  link.textContent = caption || (isVideo ? 'Meu vídeo' : 'Minha foto');
  link.onclick = () => {
    openView('feed');
    post.scrollIntoView();
  };
  byId('mine').prepend(link);
  byId('empty').hidden = true;
}
const restored = posts('readonly', store => store.getAll()).then(records => {
  records.forEach(showPost);
  if (!records.length) byId('feed-empty').textContent = 'Seu feed está vazio. Toque em Publicar para adicionar uma foto ou um vídeo.';
}).catch(() => {
  byId('feed-empty').textContent = 'Não foi possível carregar suas publicações.';
  byId('notice').textContent = 'Não foi possível acessar as publicações deste navegador.';
});
byId('composer').onsubmit = async event => {
  event.preventDefault();
  const form = event.currentTarget;
  const data = new FormData(form);
  const file = data.get('file');
  if (!/^(image|video)\//.test(file.type)) {
    byId('notice').textContent = 'Escolha uma foto ou um vídeo.';
    return;
  }
  const submit = form.querySelector('button[type="submit"], button');
  playShutter();
  submit.disabled = true;
  const record = {file, caption: data.get('caption').trim(), composition: file.type.startsWith('image/') ? data.get('composition').trim() : ''};
  try {
    await restored;
    await posts('readwrite', store => store.add(record));
    showPost(record);
    form.reset();
    byId('notice').textContent = '';
    openView('feed');
  } catch {
    byId('notice').textContent = 'Não foi possível salvar neste navegador. Verifique o espaço disponível.';
  } finally {
    submit.disabled = false;
  }
};
let installPrompt;
const installButton = byId('install-app');
window.addEventListener('beforeinstallprompt', event => {
  event.preventDefault();
  installPrompt = event;
});
function hideInstalled() { installButton.hidden = true; }
if (matchMedia('(display-mode: standalone)').matches || navigator.standalone) hideInstalled();
window.addEventListener('appinstalled', hideInstalled);
installButton.onclick = async () => {
  if (installPrompt) {
    const prompt = installPrompt;
    installPrompt = null;
    try {
      await prompt.prompt();
      return;
    } catch {}
  }
  byId('invite-status').textContent = /iPhone|iPad/i.test(navigator.userAgent)
    ? 'No Safari, toque em Compartilhar → Adicionar à Tela de Início.'
    : 'Abra no Chrome e escolha Instalar app ou Adicionar à tela inicial no menu.';
};
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
</script></body></html>
